spring.application.name=HeyArtcraftWeb

# Puerto donde se escuchara el servidor
server.port=8081

# Formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

# Eliminar mensajes invasivos de spring
spring.main.banner-mode=off

# Cache del servidor: false en durante el desarrollo, true en produccion
spring.thymeleaf.cache=false

# Conexion a Oracle Autonomous Database por Cloud Wallet
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:lenguajebd_high}?TNS_ADMIN=${WALLET_PATH}
spring.datasource.username=${DB_USER:PROYECTO_SC504}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Mostrar información en el log

# Configuración de Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Firebase Storage
firebase.storage.bucket=sc-403-heyartcraftweb.firebasestorage.app

# Tamaño máximo para imágenes de productos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servicios externos: apagados por defecto (no forman parte del Avance 2)
# Google OAuth se activa con el perfil "google" (application-google.properties)
app.oauth.google.enabled=false
app.correo.enabled=false
app.firebase.enabled=false

# Modulos cuya capa de BD aun no se ha entregado
app.modulos.catalogo.enabled=false
app.modulos.compra.enabled=false
