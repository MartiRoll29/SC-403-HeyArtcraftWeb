<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <header th:replace="~{general/fragmentos:: header}"/>

        <section class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm w-100">
                        <div class="card-body p-4">
                            <div class="text-center mb-2 mt-3">
                                <h3 class="categoria-titulo mb-4">[[#{contacto.titulo}]]</h3>
                            </div>

                            <form th:action="@{/contacto}" th:object="${mensajeContacto}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-custom">
                                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                                </div>

                                <label class="form-label" for="nombreRemitente">[[#{contacto.nombre}]]</label>
                                <input type="text" id="nombreRemitente" th:field="*{nombreRemitente}" class="form-control"
                                       maxlength="100" required="required"/>
                                <div class="text-danger small" th:errors="*{nombreRemitente}"></div>

                                <label class="form-label mt-3" for="correoRemitente">[[#{contacto.correo}]]</label>
                                <input type="email" id="correoRemitente" th:field="*{correoRemitente}" class="form-control"
                                       maxlength="150" required="required"/>
                                <div class="text-danger small" th:errors="*{correoRemitente}"></div>

                                <label class="form-label mt-3" for="asunto">[[#{contacto.asunto}]]</label>
                                <input type="text" id="asunto" th:field="*{asunto}" class="form-control"
                                       maxlength="200" required="required"/>
                                <div class="text-danger small" th:errors="*{asunto}"></div>

                                <label class="form-label mt-3" for="mensaje">[[#{contacto.mensaje}]]</label>
                                <textarea id="mensaje" th:field="*{mensaje}" class="form-control"
                                          rows="5" maxlength="2000" required="required"></textarea>
                                <div class="text-danger small" th:errors="*{mensaje}"></div>

                                <button type="submit" class="btn btn-custom w-100 mt-4">
                                    <i class="fa-solid fa-paper-plane"></i> [[#{contacto.enviar}]]
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section th:replace="~{general/fragmentos:: mostrarToast}"/>

        <footer th:replace="~{general/fragmentos:: footer}"/>
    </body>
</html>
