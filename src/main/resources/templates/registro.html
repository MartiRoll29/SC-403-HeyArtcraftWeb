<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <div class="container-fluid vh-100">
            <div class="row h-100">
                <!-- Columna izquierda -->
                <div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-registro text-white">
                    <img th:src="@{/img/logoblanco.png}"
                         alt="Logo de Hey Artcraft"
                         class="logo-login"/>
                    <h1>¡Bienvenido/a!</h1>
                    <h4 class="mt-3">Crea tu cuenta y comienza a transformar tus ideas</h4>
                </div>

                <!-- Columna derecha -->
                <div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-right">
                    <div class="login-card p-4 shadow-sm">             
                        <div class="text-center mb-2 mt-3">
                            <h3 class="categoria-titulo mb-4">[[#{registro.titulo}]]</h3>
                        </div>

                        <!-- Mensajes de error -->
                        <div th:if="${param.error}" class="alert alert-custom">
                            [[#{registro.error}]]
                        </div>

                        <!-- Formulario de registro -->
                        <form th:action="@{/registro}" th:object="${usuario}" method="post">
                            <label class="form-label" for="nombre">[[#{registro.nombre}]]</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required/>

                            <label class="form-label mt-3" for="apellidos">[[#{registro.apellidos}]]</label>
                            <input type="text" id="apellidos" th:field="*{apellidos}" class="form-control" required/>

                            <label class="form-label mt-3" for="correo">[[#{registro.correo}]]</label>
                            <input type="email" id="correo" th:field="*{correo}" class="form-control" required/>

                            <label class="form-label mt-3" for="username">[[#{registro.usuario}]]</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" required/>

                            <label class="form-label mt-3" for="password">[[#{registro.password}]]</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" required/>

                            <button type="submit" class="btn btn-registro w-100 mt-4">
                                <i class="fa-solid fa-user-plus"></i> [[#{registro.crearCuenta}]]
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="small">¿Ya tienes una cuenta?</span>
                            <a th:href="@{/login}" class="small fw-bold text-decoration-none">Iniciar Sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
