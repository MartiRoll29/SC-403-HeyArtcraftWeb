<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <header th:replace="~{general/fragmentos:: header}"/>

        <section class="container my-5">
            <h3 class="categoria-titulo mb-4">[[#{perfil.facturas}]]</h3>

            <div th:if="${#lists.isEmpty(facturas)}" class="alert alert-custom">
                [[#{facturas.vacio}]]
            </div>

            <div th:unless="${#lists.isEmpty(facturas)}" class="table-responsive">
                <table class="table table-hover align-middle bg-white shadow-sm">
                    <thead>
                        <tr>
                            <th scope="col">[[#{facturas.numero}]]</th>
                            <th scope="col">[[#{facturas.pedido}]]</th>
                            <th scope="col">[[#{facturas.fecha}]]</th>
                            <th scope="col" class="text-end">[[#{facturas.subtotal}]]</th>
                            <th scope="col" class="text-end">[[#{facturas.impuesto}]]</th>
                            <th scope="col" class="text-end">[[#{facturas.total}]]</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${facturas}">
                            <td class="fw-bold" th:text="'#' + ${f.idFactura}"></td>
                            <td th:text="'#' + ${f.idPedido}"></td>
                            <td th:text="${#temporals.format(f.fechaEmision, 'dd-MM-yyyy HH:mm')}"></td>
                            <td class="text-end" th:text="${'₡' + #numbers.formatDecimal(f.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-end" th:text="${'₡' + #numbers.formatDecimal(f.impuesto, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-end fw-bold" th:text="${'₡' + #numbers.formatDecimal(f.montoTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <a th:href="@{/perfil}" class="btn btn-custom mt-3">
                <i class="fa-solid fa-arrow-left"></i> [[#{accion.regresar}]]
            </a>
        </section>

        <footer th:replace="~{general/fragmentos:: footer}"/>
    </body>
</html>
