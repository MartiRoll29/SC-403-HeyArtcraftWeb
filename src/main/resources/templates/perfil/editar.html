<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <header th:replace="~{general/fragmentos:: header}"/>

        <section class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm w-100">
                        <div class="card-body p-4">
                            <div class="text-center mb-2 mt-3">
                                <h3 class="categoria-titulo mb-4">[[#{perfil.editar.titulo}]]</h3>
                            </div>

                            <form th:action="@{/perfil/editar}" th:object="${usuario}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-custom">
                                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                                </div>

                                <label class="form-label" for="nombre">[[#{registro.nombre}]]</label>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                       maxlength="100" required="required"/>
                                <div class="text-danger small" th:errors="*{nombre}"></div>

                                <label class="form-label mt-3" for="correo">[[#{registro.correo}]]</label>
                                <input type="email" id="correo" th:field="*{correo}" class="form-control"
                                       maxlength="150" required="required"/>
                                <div class="text-danger small" th:errors="*{correo}"></div>
                                <small class="text-muted">[[#{perfil.editar.avisoCorreo}]]</small>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-custom">
                                        <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                                    </button>
                                    <a th:href="@{/perfil}" class="btn btn-custom">
                                        <i class="fa-solid fa-arrow-left"></i> [[#{accion.regresar}]]
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos:: footer}"/>
    </body>
</html>
