<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <header th:replace="~{general/fragmentos:: header}"/>

        <section class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm w-100">
                        <div class="card-body p-4">
                            <div class="text-center mb-2 mt-3">
                                <h3 class="categoria-titulo mb-4"
                                    th:text="${direccion.idDireccion == null ? #messages.msg('direccion.nueva') : #messages.msg('direccion.editar')}"></h3>
                            </div>

                            <form th:action="${direccion.idDireccion == null} ? @{/perfil/direcciones/nueva} : @{/perfil/direcciones/{id}/editar(id=${direccion.idDireccion})}"
                                  th:object="${direccion}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-custom">
                                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                                </div>

                                <label class="form-label" for="provincia">[[#{direccion.provincia}]]</label>
                                <input type="text" id="provincia" th:field="*{provincia}" class="form-control"
                                       maxlength="50" required="required"/>
                                <div class="text-danger small" th:errors="*{provincia}"></div>

                                <label class="form-label mt-3" for="canton">[[#{direccion.canton}]]</label>
                                <input type="text" id="canton" th:field="*{canton}" class="form-control"
                                       maxlength="50" required="required"/>
                                <div class="text-danger small" th:errors="*{canton}"></div>

                                <label class="form-label mt-3" for="distrito">[[#{direccion.distrito}]]</label>
                                <input type="text" id="distrito" th:field="*{distrito}" class="form-control"
                                       maxlength="50" required="required"/>
                                <div class="text-danger small" th:errors="*{distrito}"></div>

                                <label class="form-label mt-3" for="senasExactas">[[#{direccion.senas}]]</label>
                                <textarea id="senasExactas" th:field="*{senasExactas}" class="form-control"
                                          rows="3" maxlength="300" required="required"></textarea>
                                <div class="text-danger small" th:errors="*{senasExactas}"></div>

                                <label class="form-label mt-3" for="codigoPostal">[[#{direccion.codigoPostal}]]</label>
                                <input type="text" id="codigoPostal" th:field="*{codigoPostal}" class="form-control"
                                       maxlength="10"/>
                                <div class="text-danger small" th:errors="*{codigoPostal}"></div>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-custom">
                                        <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                                    </button>
                                    <a th:href="@{/perfil/direcciones}" class="btn btn-custom">
                                        <i class="fa-solid fa-arrow-left"></i> [[#{accion.regresar}]]
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos:: footer}"/>
    </body>
</html>
