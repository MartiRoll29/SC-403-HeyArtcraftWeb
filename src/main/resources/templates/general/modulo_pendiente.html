<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos:: head}"/>
    <body>
        <header th:replace="~{general/fragmentos:: header}"/>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <i class="fa-solid fa-screwdriver-wrench mb-3" style="font-size:3rem; color:#3a2418;"></i>
                    <h3 class="categoria-titulo">[[#{modulo.pendiente.titulo}]]</h3>
                    <p class="mt-3" th:text="#{modulo.pendiente.texto(${modulo})}"></p>
                    <a th:href="@{/}" class="btn btn-custom mt-2">
                        <i class="fa-solid fa-house"></i> [[#{plantilla.inicio}]]
                    </a>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos:: footer}"/>
    </body>
</html>
